<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" fill="none">
  <defs>
    <linearGradient id="g1" x1="70" y1="40" x2="250" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#29FFE2"/>
      <stop offset="1" stop-color="#00A3FF"/>
    </linearGradient>
    <linearGradient id="g2" x1="70" y1="40" x2="250" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF4FD8"/>
      <stop offset="1" stop-color="#6B5BFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(24 16)">
    <circle cx="120" cy="145" r="94" stroke="url(#g1)" stroke-width="20" filter="url(#glow)"/>
    <path d="M182 84C206 102 220 130 220 161C220 212 179 252 129 252" stroke="url(#g2)" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>

    <g fill="#A8F8FF" filter="url(#glow)">
      <circle cx="55" cy="161" r="5"/>
      <circle cx="86" cy="86" r="4.5"/>
      <circle cx="173" cy="86" r="4.5"/>
      <circle cx="222" cy="163" r="4.5"/>
      <circle cx="129" cy="252" r="5"/>
    </g>
  </g>

  <text x="318" y="140" fill="#E8F6FF" font-family="Segoe UI, Arial" font-size="78" font-weight="800" letter-spacing="1.2">OneRoster</text>
  <text x="318" y="192" fill="#7CD9FF" font-family="Segoe UI, Arial" font-size="28" font-weight="700" direction="rtl" text-anchor="start">מנהל אנשי קשר</text>
  <rect x="318" y="212" width="430" height="2" fill="#3E5A8B"/>
</svg>
